    questions:
      - How long after completion can a payment still be refunded?
      - Is there a time limit for requesting a refund?

  - id: payments.webhook_retries
    source: payments.md
    pattern: 'Failed webhooks are retried up to (\d+ times)'
    questions:
      - How many times is a failed webhook delivery retried?
      - What is the retry limit for payment webhooks?

