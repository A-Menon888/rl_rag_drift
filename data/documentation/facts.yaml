# Fact-level ground truth for the documentation corpus.
#
# Each fact names ONE answer slot on its owning reference page (`source`).
# Values are never written here: `pattern` (exactly one capture group) is
# applied to every snapshot, so
#   memory answer = value on the KB-0 page (what the frozen generator saw),
#   gold answer   = value on the evaluated KB's page (absent => unanswerable),
#   drift type    = computed by comparing the KB-A and KB-B values.
# The owning page is authoritative. The same slot stated with a different
# value on another page (e.g. an out-of-date FAQ) is a contradiction.
#
# Questions are written by hand, must not contain any value of the fact,
# and are what the policy and retriever see.
#
# Facts whose pattern matches no snapshot are "absent": plausible questions
# the documentation never answers. The correct behaviour is GIVE_UP.
#
# Drift events. A drift event is one underlying KB-A -> KB-B change. Most
# facts are their own event (no `drift_event` key). Facts that share a
# `drift_event` changed for a single documented reason, so they must not be
# counted as independent drift events in analysis. An event is declared only
# when the shared cause is verifiable from the documents (tested):
drift_events:
  api_v2_migration: >-
    The API moved to version 2. Every member's KB-B value equals its KB-A value
    with the version path segment (/v1, or none on the unversioned users/payments
    pages) replaced by /v2; no other change is involved. Spans api.md, users.md
    and payments.md.
  user_list_max_size: >-
    One quantity, the maximum number of users per list request, stated on both
    users.md and api.md (100 -> 200). The stale FAQ also restates it, which is
    why the users.md member is `contradicted` and the api.md member `modified`.
  webhook_api_added: >-
    A new "Webhook API" section added to api.md in KB-B, introducing both
    webhook endpoints together.

# Near-duplicate facts: different facts whose questions ask for the same
# property, so a statement on one page answers the other fact's question.
# (Sibling slots such as first- vs last-name length are not duplicates: they
# have different answers.) The train/test split keeps every drift event and
# every group below, and anything linked to them, on one side
# (src/data/facts.py, `split_units`). Duplicates already sharing a drift event
# (create-endpoint pairs, list-size pair) need no entry here.
split_groups:
  creation_status: [payments.create_status, create_status]
  payment_idempotency: [payments.idempotency_requirement, payment_idempotency]
  rate_limits: [users.listing_rate_limit, api_rate_limit]

facts:
  # ── payments.md ──────────────────────────────────────────────────────────
  - id: payments.create_endpoint
    source: payments.md
    drift_event: api_v2_migration
    pattern: 'Create a payment with POST (\S+)\.'
    questions:
      - Which endpoint do I call to create a new payment?
      - What path is used to submit a payment charge?

  - id: payments.amount_unit
    source: payments.md
    pattern: 'Payment amounts are represented in (\w+)'
    questions:
      - In what unit are payment amounts expressed?
      - Should I send payment amounts in whole dollars or some smaller unit?

  - id: payments.default_currency
    source: payments.md
    pattern: 'The default currency is ([A-Z]{3})'
    questions:
      - Which currency is applied when a payment request does not specify one?
      - What is the fallback currency for payments?

  - id: payments.max_amount
    source: payments.md
    pattern: 'The maximum payment amount is (\d+ cents)'
    questions:
      - What is the largest amount a single payment can be?
      - Is there an upper limit on the size of a payment?

  - id: payments.manual_review_threshold
    source: payments.md
    pattern: 'Payments above (\d+ cents) require manual review'
    questions:
      - Above what amount does a payment need manual review?
      - When does the risk team have to approve a payment before it is captured?

  - id: payments.idempotency_requirement
    source: payments.md
    pattern: 'Payment requests (\w+) idempotency keys'
    questions:
      - Are idempotency keys optional or mandatory on payment requests?
      - Do payment requests have to include an idempotency key?

  - id: payments.idempotency_ttl
    source: payments.md
    pattern: 'Idempotency keys are valid for (\d+ hours)'
    questions:
      - How long does an idempotency key remain valid?
      - For how long can I retry a payment with the same idempotency key?

  - id: payments.failure_status
    source: payments.md
    pattern: 'Payment failures return HTTP (\d{3})'
    questions:
      - Which HTTP status code does a failed payment return?
      - What status code signals that a payment could not be processed?

  - id: payments.create_status
    source: payments.md
    pattern: 'Successful payment creation returns HTTP (\d{3})'
    questions:
      - What status code is returned when a payment is created successfully?
      - Which HTTP code confirms that a new payment was created?

  - id: payments.refund_endpoint
    source: payments.md
    drift_event: api_v2_migration
    pattern: 'Refund requests use POST (\S+)\.'
    questions:
      - Which endpoint issues a refund for a payment?
      - How do administrators trigger a payment refund through the API?

  - id: payments.refund_window
    source: payments.md
